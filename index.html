<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Idle RPG</h1>
    <button id="changelogButton" style="font-size: 0.8em; padding: 5px; margin-bottom: 10px;">View Changelog</button>
    <div id="levelDisplay">Level: 1</div>
    <div id="xpDisplay">XP: 0/100</div>
    <div id="progress-bar-container">
        <div id="progressBar"></div>
    </div>
    <button id="gainXpButton">Gain XP</button>
    <script src="script.js"></script>

    <div id="changelogModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-button" id="closeChangelogButton">&times;</span>
            <h2>Changelog</h2>
            <div id="changelogEntries">
                <!-- Changelog content will be populated by JavaScript -->
            </div>
        </div>
    </div>
</body>
</html>
